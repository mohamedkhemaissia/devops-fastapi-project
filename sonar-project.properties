# =============================================================================
# sonar-project.properties - SonarCloud configuration
# =============================================================================
# SonarCloud analyzes your code for:
#   - Bugs
#   - Vulnerabilities
#   - Code smells
#   - Test coverage
#
# Setup:
#   1. Go to https://sonarcloud.io
#   2. Sign in with GitHub
#   3. Create a new project
#   4. Get your SONAR_TOKEN
#   5. Add SONAR_TOKEN to GitHub repository secrets
# =============================================================================

# Project identification
# Replace with your actual SonarCloud organization name
sonar.organization=mohamedkhemaissia

# Unique key for this project in SonarCloud
sonar.projectKey=mohamedkhemaissia_devops-fastapi-project

# Human-readable project name
sonar.projectName=devops-fastapi-project

# Project version
sonar.projectVersion=1.0.0

# =============================================================================
# Source configuration
# =============================================================================

# Where SonarCloud should look for source files
sonar.sources=src

# Where SonarCloud should look for test files
sonar.tests=src/tests

# Files to exclude from analysis
sonar.exclusions=**/venv/**,**/__pycache__/**,**/node_modules/**

# Python version
sonar.python.version=3.11

# =============================================================================
# Coverage configuration
# =============================================================================

# If you generate coverage reports with pytest-cov, point to them here:
# sonar.python.coverage.reportPaths=coverage.xml
