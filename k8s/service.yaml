# =============================================================================
# service.yaml - Kubernetes Service for the FastAPI application
# =============================================================================
# Apply with: kubectl apply -f k8s/service.yaml
# Check status: kubectl get services
# Access: http://<node-ip>:30000
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  # Name of the service
  name: todo-api-service
  labels:
    app: todo-api

spec:
  # NodePort: exposes the service on each node's IP at a static port
  # This allows access from outside the Kubernetes cluster
  type: NodePort

  # Selector: which pods does this service route traffic to?
  selector:
    app: todo-api

  ports:
    - name: http
      # Port: the port on the service (internal)
      port: 80
      # TargetPort: the port on the pods/containers
      targetPort: 8000
      # NodePort: the port exposed on each cluster node (accessible externally)
      # Range: 30000-32767
      nodePort: 30000
      protocol: TCP
