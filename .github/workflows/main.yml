# =============================================================================
# main.yml - GitHub Actions CI/CD Pipeline for the 'main' branch
# =============================================================================
# This pipeline runs when code is pushed to the 'main' branch.
# It runs tests, checks code quality, builds a Docker image with the 'latest'
# tag, and pushes it to GitHub Container Registry.
# =============================================================================

name: CI/CD Pipeline - Main Branch

# Trigger: Run this pipeline when code is pushed to the 'main' branch
on:
  push:
    branches:
      - main

# Environment variables available to all jobs
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Run Tests
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Step 1: Download the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      # Step 4: Run the tests with pytest
      - name: Run tests
        run: |
          cd src
          pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # JOB 2: Code Quality Check with SonarCloud
  # ---------------------------------------------------------------------------
  sonarcloud:
    name: SonarCloud Code Quality
    runs-on: ubuntu-latest
    needs: test  # Only run after tests pass
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # SonarCloud needs the full git history for accurate analysis
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed for PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}     # Your SonarCloud token

  # ---------------------------------------------------------------------------
  # JOB 3: Build and Push Docker Image with 'latest' tag
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test  # Only run after tests pass

    # Permissions needed to push to GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Download the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Extract metadata for the Docker image
      # For main branch: tags the image as 'latest' plus the commit SHA
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag as 'latest' for the main branch
            type=raw,value=latest
            # Tag with the short commit SHA (e.g., sha-abc1234)
            type=sha,prefix=sha-

      # Step 4: Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
